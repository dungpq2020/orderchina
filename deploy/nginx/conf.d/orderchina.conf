# 1 domain duy nhất, tách theo path thay vì subdomain:
#   /            -> customer-web (khách hàng)
#   /api/        -> customer-api
#   /admin       -> admin-web (nhân viên, Next.js basePath "/admin")
#   /admin/api/  -> admin-api
#
# QUAN TRỌNG: proxy_pass KHÔNG có trailing slash + KHÔNG có path phía sau host:port
# => Nginx forward NGUYÊN VẸN path gốc (kể cả /admin/api hoặc /admin) sang backend,
# không tự strip prefix. Backend (ASP.NET Core) tự xử lý phần prefix qua UsePathBase
# (xem Program.cs của AdminApi/CustomerApi) — nhờ vậy cookie Path do backend set ra
# luôn khớp đúng với path public thấy ở đây, kể cả khi so sánh với lúc chạy dev không
# qua Nginx (PathBase rỗng ở Development).
#
# Lưu ý bảo mật: vì cùng 1 origin, cookie refresh token của admin/customer nằm chung
# cookie jar của trình duyệt. Scope cookie Path hẹp đúng theo prefix dưới đây giảm thiểu
# (không loại bỏ hoàn toàn) rủi ro XSS ở phần customer-facing pivot sang gọi ngầm API admin.

server {
    listen 80;
    server_name nhaphangtrungquoc.sdnagency.com;

    # Webroot cho Let's Encrypt HTTP-01 challenge (certbot renew sau này vẫn cần đường này ở plain HTTP).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Mọi request khác ép chuyển sang HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nhaphangtrungquoc.sdnagency.com;

    ssl_certificate     /etc/letsencrypt/live/nhaphangtrungquoc.sdnagency.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nhaphangtrungquoc.sdnagency.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /admin/api/ {
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://admin-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://customer-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://customer-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
